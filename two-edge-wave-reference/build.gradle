plugins {
	id "java-library"
}

dependencies {
	testImplementation(platform("org.junit:junit-bom:5.10.3"))
	testImplementation("org.junit.jupiter:junit-jupiter")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.test {
	useJUnitPlatform()
}

tasks.register("waveReferenceSmoke", JavaExec) {
	group = "verification"
	description = "Runs a small deterministic 2D free-field FDTD reference."
	classpath = sourceSets.main.runtimeClasspath
	mainClass.set("com.tenicana.dronecraft.acoustics.wave.WaveReferenceSmoke")
}
