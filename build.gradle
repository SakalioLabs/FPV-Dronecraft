plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}" apply false
}

subprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version

	plugins.withType(JavaPlugin).configureEach {
		java {
			sourceCompatibility = JavaVersion.VERSION_21
			targetCompatibility = JavaVersion.VERSION_21
		}

		tasks.withType(JavaCompile).configureEach {
			options.encoding = "UTF-8"
			options.release = 21
		}
	}
}

def dechoratePythonDependencies = file(
	"external-data/computational-acoustics/dechorate-python-deps"
)

tasks.register("testAcousticResearchScripts", Exec) {
	group = "verification"
	description = "Runs the lightweight Python acoustic-research regressions."
	dependsOn("ensureDechorateAnalysisDependencies")
	workingDir = rootDir
	environment(
		"PYTHONPATH",
		dechoratePythonDependencies.absolutePath
			+ File.pathSeparator
			+ file("docs/scripts").absolutePath
	)
	commandLine(
		"python",
		"-m",
		"unittest",
		"discover",
		"-s",
		"docs/scripts",
		"-p",
		"test_*.py"
	)
}

