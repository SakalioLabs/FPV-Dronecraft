		dechorateSofaPins.absolutePath,
		"--old-directory",
		dechorateSofaDirectory.absolutePath,
		"--new-pins",
		dechorateConfirmatoryInventoryPins.absolutePath,
		"--new-directory",
		dechorateConfirmatoryDirectory.absolutePath,
		"--annotation-directory",
		dechorateSofaDirectory.absolutePath,
		"--d119-report",
		file(
			"build/research/"
				+ "dechorate-echo-window-failure-diagnostic-v1.json"
		).absolutePath,
		"--output-json",
		file(
			"build/research/"
				+ "bounded-first-order-gain-dechorate-"
				+ "exploratory-verification-v1.json"
		).absolutePath
	)
}

