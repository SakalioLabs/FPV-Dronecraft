	}
	commandLine(
		"python",
		"docs/scripts/analyze_ptb_material_absorption.py",
		"--manifest",
		file(
			"docs/acoustics/ptb-material-selection-v1.json"
		).absolutePath,
		"--selection-csv",
		ptbMaterialSelectionCsv.absolutePath,
		"--output-json",
		ptbMaterialReport.absolutePath,
		"--energy-weights",
		"1,1,1,1,1,1"
	)
}

