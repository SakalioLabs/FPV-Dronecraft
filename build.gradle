tasks.register("analyzePtbMaterialAbsorption", Exec) {
	group = "acoustic research"
	description = "Builds provisional PTB-derived Minecraft material bands."
	dependsOn("fetchPtbMaterialAbsorption")
	workingDir = rootDir
	doFirst {
		if (!ptbMaterialSelectionCsv.isFile()) {
			throw new GradleException(
				"Missing ptb-selection-table.csv extraction cache. "
					+ "Export the PTB selection_table worksheet as CSV; "
					+ "the pinned ZIP entry remains authoritative."
