name: CI Verification

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FPVDRONE_UPDATE_GOLDEN_TRACES: "false"

jobs:
  targets:
    name: Discover implemented targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        name: Read target inventory
        shell: python
        run: |
          import json, os
          with open("gradle/minecraft-targets.json", encoding="utf-8") as source:
              inventory = json.load(source)
          targets = [
              {"minecraft": row["minecraft"], "java": row["java"]}
              for row in inventory["targets"]
              if row.get("implemented") is True and row.get("status") != "planned"
          ]
          if not targets:
              raise SystemExit("No implemented Minecraft targets are available")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": targets}, separators=(",", ":")) + "\n")

  neoforge-build:
    name: NeoForge / Minecraft ${{ matrix.minecraft }} build and packaging
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-java@v4
        if: ${{ matrix.java == 25 }}
        with:
          distribution: temurin
          java-version: "25"
      - name: Prepare wrapper
        run: chmod +x ./gradlew
      - name: Check golden trace policy
        run: test "$FPVDRONE_UPDATE_GOLDEN_TRACES" = "false"
      - name: Build and verify NeoForge packaging
        run: ./gradlew --no-daemon --no-parallel --max-workers=1 "-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64" -PtargetMinecraft=${{ matrix.minecraft }} :neoforge-mod:assemble :neoforge-mod:verifyNeoForgePackaging
      - name: Upload target jar and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-mc${{ matrix.minecraft }}
          path: |
            build/targets/${{ matrix.minecraft }}/neoforge-mod/libs/*.jar
            !build/targets/${{ matrix.minecraft }}/neoforge-mod/libs/*-sources.jar
            build/targets/${{ matrix.minecraft }}/neoforge-mod/reports/**
            build/targets/${{ matrix.minecraft }}/neoforge-mod/run/logs/**
            build/targets/${{ matrix.minecraft }}/neoforge-mod/run/crash-reports/**
          if-no-files-found: warn
          retention-days: 14

  supported-profile-tests:
    name: NeoForge / Minecraft 1.21.1 unit and GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Prepare wrapper
        run: chmod +x ./gradlew
      - name: Run unit tests and GameTests
        run: ./gradlew --no-daemon --no-parallel --max-workers=1 -PtargetMinecraft=1.21.1 :drone-sim-core:test :computational-acoustics-core:test :neoforge-mod:test :neoforge-mod:runGameTestServer
      - name: Upload test reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-mc1.21.1-tests
          path: |
            drone-sim-core/build/reports/**
            computational-acoustics-core/build/reports/**
            build/targets/1.21.1/neoforge-mod/reports/**
            build/targets/1.21.1/neoforge-mod/run/logs/**
            build/targets/1.21.1/neoforge-mod/run/crash-reports/**
          if-no-files-found: warn
          retention-days: 7

  server-self-tests:
    name: NeoForge / Minecraft ${{ matrix.minecraft }} / four flight self-tests
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-java@v4
        if: ${{ matrix.java == 25 }}
        with:
          distribution: temurin
          java-version: "25"
      - name: Prepare wrapper
        run: chmod +x ./gradlew
      - name: Accept EULA for isolated CI server
        run: |
          mkdir -p build/targets/${{ matrix.minecraft }}/neoforge-mod/run
          printf 'eula=true\n' > build/targets/${{ matrix.minecraft }}/neoforge-mod/run/eula.txt
      - name: Run four server self-tests sequentially
        run: ./gradlew --no-daemon --no-parallel --max-workers=1 "-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64" -PtargetMinecraft=${{ matrix.minecraft }} :neoforge-mod:runServerSelfTest :neoforge-mod:runPlayableServerSelfTest :neoforge-mod:runPlayableHorizonServerSelfTest :neoforge-mod:runPlayableAcroServerSelfTest -PfpvdroneSelfTestSeconds=12
      - name: Upload target self-test report and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-mc${{ matrix.minecraft }}-flight-selftests
          path: |
            build/targets/${{ matrix.minecraft }}/neoforge-mod/run/fpvdrone-selftest/**
            build/targets/${{ matrix.minecraft }}/neoforge-mod/run/logs/**
            build/targets/${{ matrix.minecraft }}/neoforge-mod/run/crash-reports/**
          if-no-files-found: warn
          retention-days: 7
