plugins {
	id "java-library"
	id "net.neoforged.moddev"
}

apply from: rootProject.file("gradle/fpvdrone-version-profiles.gradle")
apply from: rootProject.file("gradle/fpvdrone-selftest-validation.gradle")
apply from: rootProject.file("gradle/fpvdrone-neoforge-distributions.gradle")
apply from: rootProject.file("gradle/fpvdrone-neoforge-packaging-validation.gradle")

base {
	archivesName = "${rootProject.archives_base_name}-neoforge-mc${project.minecraft_version}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(fpvDroneTargetJava)
	withSourcesJar()
}

tasks.named("jar", Jar) {
	from(rootProject.file("LICENSE")) {
		into "META-INF"
	}
}

sourceSets {
	gameTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	if (project.minecraft_version == "1.21.1") {
		clientValidation {
			compileClasspath += sourceSets.main.output
			runtimeClasspath += sourceSets.main.output
		}
		integrationValidation {
			compileClasspath += sourceSets.main.output
			runtimeClasspath += sourceSets.main.output
		}
	}
}

configurations {
	fpvDroneBundledMixinExtras {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
	gameTestImplementation.extendsFrom implementation
	gameTestRuntimeOnly.extendsFrom runtimeOnly
	if (project.minecraft_version == "1.21.1") {
		clientValidationImplementation.extendsFrom implementation
		clientValidationRuntimeOnly.extendsFrom runtimeOnly
		integrationValidationImplementation.extendsFrom implementation
		integrationValidationRuntimeOnly.extendsFrom runtimeOnly
	}
}

def gameTestReport = layout.buildDirectory.file("reports/gametest/results.xml")
def clientSmokeRunId = UUID.randomUUID().toString()
def clientSmokeReport = layout.buildDirectory.file("run/fpvdrone-client-smoke/report.json")
def clientWorldValidationRunId = UUID.randomUUID().toString()
def clientWorldValidationReport = layout.buildDirectory.file("run-client-validation/fpvdrone-client-validation/report.json")
def fpvDroneSelfTestSecondsProperty = providers.gradleProperty("fpvdroneSelfTestSeconds").orElse("12")
def fpvDroneSelfTestSeconds = {
	def rawSeconds = fpvDroneSelfTestSecondsProperty.get().trim()
	try {
		def seconds = Integer.parseInt(rawSeconds)
		if (seconds < 6 || seconds > 60) {
			throw new GradleException("fpvdroneSelfTestSeconds must be an integer from 6 through 60, but was '${rawSeconds}'.")
		}
		return seconds
	} catch (NumberFormatException ignored) {
		throw new GradleException("fpvdroneSelfTestSeconds must be an integer from 6 through 60, but was '${rawSeconds}'.")
	}
}()
def requiredGameTests = [
		"survivalplacementconsumesoneandstartsunbound",
		"creativeplacementkeepsitemandsupportsslabs",
		"blockedorunsupportedplacementdoesnotconsumeorspawn",
		"controlleruseandplaininteractionnevercreatebindorrepair",
		"shiftbindingselectsexactdronekeepsdamageandotherdata",
		"bindingrejectsotherownerremovedandoutofreach",
		"armeddronecannotberebound",
		"racingquaddiagnosticclimbsingame",
		"newdronestartsinstableanglemode",
		"droneentityplayablerouteexecutesthroughrouter",
		"droneentitysimulationrouteexecutesthroughrouter",
		"directflightdisarmclearsplayableattitude",
		"directflightrespectsceilingcollision",
		"directflightlinklossusesplayablefailsafe",
		"acrosignedfullturnskeepentityrenderandcontrolframesaligned",
		"assembly_retains_selected_modules_and_stack_persistence",
		"assembly_rejects_duplicate_missing_and_unrelated_modules",
		"vanilla_recipe_keeps_standalone_drone_unconfigured"
] as Set

neoForge {
	enable {
		version = project.neoforge_version
		disableRecompilation = true
		enabledSourceSets = [sourceSets.main, sourceSets.gameTest] as Set
		if (project.minecraft_version == "1.21.1") {
			enabledSourceSets.add(sourceSets.clientValidation)
			enabledSourceSets.add(sourceSets.integrationValidation)
		}
	}

	mods {
		fpvdrone {
			sourceSet(sourceSets.main)
		}

		fpvdrone_gametest {
			sourceSet(sourceSets.gameTest)
		}
		if (project.minecraft_version == "1.21.1") {
			fpvdrone_client_validation { sourceSet(sourceSets.clientValidation) }
			fpvdrone_integration_validation { sourceSet(sourceSets.integrationValidation) }
		}
	}

	runs {
		client {
			client()
			loadedMods.set([mods.fpvdrone] as Set)
		}
		clientSmoke {
			client()
			loadedMods.set([mods.fpvdrone] as Set)
			systemProperty "fpvdrone.client_smoke", "true"
			systemProperty "fpvdrone.client_smoke.run_id", clientSmokeRunId
		}
		if (project.minecraft_version == "1.21.1") {
			clientWorldValidation {
				client()
				sourceSet = sourceSets.clientValidation
				loadedMods.set([mods.fpvdrone, mods.fpvdrone_client_validation] as Set)
				systemProperty "fpvdrone.client_validation", "true"
				systemProperty "fpvdrone.client_validation.run_id", clientWorldValidationRunId
				systemProperty "fpvdrone.client_validation.report", clientWorldValidationReport.get().asFile.absolutePath
				systemProperty "fpvdrone.client_validation.world", "fpv-validation-${clientWorldValidationRunId}"
				systemProperty "fpvdrone.client_validation.create_world", "true"
			}
		}

		server {
			server()
			loadedMods.set([mods.fpvdrone] as Set)
			programArgument "--nogui"
		}

		serverSelfTest {
			server()
			loadedMods.set([mods.fpvdrone] as Set)
			programArgument "--nogui"
			programArgument "--port"
			programArgument "0"
			systemProperty "fpvdrone.selftest", "true"
			systemProperty "fpvdrone.selftest.seconds", fpvDroneSelfTestSeconds.toString()
			systemProperty "fpvdrone.selftest.flight_model", "simulation"
			systemProperty "fpvdrone.selftest.control_mode", "angle"
		}

		playableServerSelfTest {
			server()
			loadedMods.set([mods.fpvdrone] as Set)
			programArgument "--nogui"
			programArgument "--port"
			programArgument "0"
			systemProperty "fpvdrone.selftest", "true"
			systemProperty "fpvdrone.selftest.seconds", fpvDroneSelfTestSeconds.toString()
			systemProperty "fpvdrone.selftest.flight_model", "playable"
			systemProperty "fpvdrone.selftest.control_mode", "angle"
		}

		playableHorizonServerSelfTest {
			server()
			loadedMods.set([mods.fpvdrone] as Set)
			programArgument "--nogui"
			programArgument "--port"
			programArgument "0"
			systemProperty "fpvdrone.selftest", "true"
			systemProperty "fpvdrone.selftest.seconds", fpvDroneSelfTestSeconds.toString()
			systemProperty "fpvdrone.selftest.flight_model", "playable"
			systemProperty "fpvdrone.selftest.control_mode", "horizon"
		}

		playableAcroServerSelfTest {
			server()
			loadedMods.set([mods.fpvdrone] as Set)
			programArgument "--nogui"
			programArgument "--port"
			programArgument "0"
			systemProperty "fpvdrone.selftest", "true"
			systemProperty "fpvdrone.selftest.seconds", fpvDroneSelfTestSeconds.toString()
			systemProperty "fpvdrone.selftest.flight_model", "playable"
			systemProperty "fpvdrone.selftest.control_mode", "acro"
		}

		gameTestServer {
			type = "gameTestServer"
			sourceSet = sourceSets.gameTest
			loadedMods.set([mods.fpvdrone, mods.fpvdrone_gametest] as Set)
			systemProperty "neoforge.enabledGameTestNamespaces", "fpvdrone"
			systemProperty "neoforge.gameTestServer", "true"
			systemProperty "fpvdrone.gameTestReport", gameTestReport.get().asFile.absolutePath
		}

		configureEach {
			logLevel = org.slf4j.event.Level.INFO
			gameDirectory = layout.buildDirectory.dir(name == "clientWorldValidation" ? "run-client-validation" : "run")
		}
	}

	unitTest {
		enable()
		testedMod = mods.fpvdrone
		loadedMods = [mods.fpvdrone] as Set
	}
}

dependencies {
	// Older NeoForge releases bundle 0.4.x, which cannot apply our expression hooks.
	// Use the library's documented ModDevGradle setup; JarJar negotiates one version.
	implementation(jarJar("io.github.llamalad7:mixinextras-neoforge:0.5.5"))
	fpvDroneBundledMixinExtras "io.github.llamalad7:mixinextras-neoforge:0.5.5"
	implementation project(":drone-sim-core")
	jarJar project(":drone-sim-core")
	implementation project(":computational-acoustics-core")
	jarJar project(":computational-acoustics-core")
	if (project.minecraft_version.startsWith("1.21.") && Integer.parseInt(project.minecraft_version.tokenize(".")[2]) < 9) {
		additionalRuntimeClasspath project(":drone-sim-core")
		additionalRuntimeClasspath project(":computational-acoustics-core")
	}

	testImplementation(platform("org.junit:junit-bom:5.10.3"))
	testImplementation("org.junit.jupiter:junit-jupiter")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	inputs.properties(
			minecraft_version: project.minecraft_version,
			neoforge_version: project.neoforge_version,
			fml_loader_range: project.minecraft_version == "26.3" ? "[12,)" : "[4,)",
			mod_version: project.mod_version
	)
	expand(
			minecraft_version: project.minecraft_version,
			neoforge_version: project.neoforge_version,
			fml_loader_range: project.minecraft_version == "26.3" ? "[12,)" : "[4,)",
			mod_version: project.mod_version
	)
	from("src/main/templates")
	into(layout.buildDirectory.dir("generated/sources/modMetadata"))
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.test {
	useJUnitPlatform()
}

tasks.named("runClientSmoke") {
	group = "verification"
	// Loader failures can prevent the in-game watchdog from ever ticking.
	// RunGameTask extends JavaExec, so interrupting it terminates its owned child.
	timeout.set(java.time.Duration.ofMinutes(4))
	description = "Validates fresh client startup and model resources; flight/view behavior requires world validation."
	doFirst { delete(clientSmokeReport) }
	doLast {
		File report = clientSmokeReport.get().asFile
		if (!report.isFile()) throw new GradleException("Client startup report was not created: ${report}")
		def evidence = new groovy.json.JsonSlurper().parse(report)
		if (evidence.run_id != clientSmokeRunId || evidence.passed != true ||
				evidence.title_screen_ready != true || evidence.controller_model_ready != true || evidence.stable_ticks < 20) {
			throw new GradleException("Client startup evidence failed or belongs to an earlier run: ${report}")
		}
		logger.lifecycle("Client startup smoke passed: {}", report)
	}
}

if (project.minecraft_version == "1.21.1") {
	tasks.register("integrationValidationJar", Jar) {
		group = "verification"
		description = "Builds the explicit opt-in native third-party validator for an isolated production server."
		archiveClassifier = "integration-validation"
		from sourceSets.integrationValidation.output
	}
	tasks.named("runClientWorldValidation") {
		group = "verification"
		timeout.set(java.time.Duration.ofMinutes(14))
		description = "Validates native placement, binding, four signed turns, remote streaming and the physical pilot in an isolated world."
		doFirst { delete(clientWorldValidationReport) }
		doLast {
			File report = clientWorldValidationReport.get().asFile
			if (!report.isFile()) throw new GradleException("Native world report missing: ${report}")
			def evidence = new groovy.json.JsonSlurper().parse(report)
			def required = [
				"native_world_ready", "unbound_controller_air_use", "two_native_survival_placements",
				"plain_interaction_does_not_bind", "shift_binds_first_uuid", "shift_rebinds_exact_second_uuid",
				"bound_controller_arm_and_yaw_network", "fpv_visible_stationary_body_and_hidden_hands",
				"third_person_visible_stationary_body_and_hidden_hands", "los_restores_native_hands",
				"positive_pitch_full_turn", "negative_pitch_full_turn", "positive_roll_full_turn", "negative_roll_full_turn",
				"unprepared_region_640m_streams", "dual_body_and_drone_block_updates",
				"remote_entity_ticks_and_two_chunk_crossings", "far_three_view_cycle_same_uuid",
				"real_husk_melee_damages_remote_pilot", "physical_pilot_falls_in_remote_view",
				"controller_loss_expires_lease_and_tickets", "reconnect_before_native_disconnect",
				"native_disconnect_clears_client_state", "server_stop_releases_remote_resources", "fixture_restored"
			]
			if (evidence.run_id != clientWorldValidationRunId || evidence.passed != true ||
					evidence.all_required_stages_observed != true || evidence.final_stage != "COMPLETE" ||
					required.any { evidence.checks?.get(it) != true }) {
				throw new GradleException("Native world observations failed or are stale: ${report}")
			}
			def axes = ["positive_pitch", "negative_pitch", "positive_roll", "negative_roll"] as Set
			if (!(evidence.turns instanceof List) || evidence.turns.size() != 4 ||
					evidence.turns.collect { it.axis }.toSet() != axes || evidence.turns.any {
						!(it.signed_body_rotation_degrees instanceof Number) || Math.abs(it.signed_body_rotation_degrees) < 720 ||
						!(it.distinct_entity_pose_advances instanceof Number) || it.distinct_entity_pose_advances < 80 ||
						!(it.native_camera_frames instanceof Number) || it.native_camera_frames < 40 ||
						!(it.maximum_camera_basis_error instanceof Number) || !Double.isFinite(it.maximum_camera_basis_error.doubleValue()) || it.maximum_camera_basis_error >= 0.002 ||
						!(it.maximum_server_model_render_basis_error instanceof Number) || !Double.isFinite(it.maximum_server_model_render_basis_error.doubleValue()) || it.maximum_server_model_render_basis_error >= 0.0001
					}) throw new GradleException("Native four-turn evidence invalid: ${report}")
			if (!(evidence.screenshots instanceof List) || evidence.screenshots.size() != 11 || evidence.screenshots.any {
				it.png_verified != true || !(it.file instanceof String) || !new File(it.file).isFile()
			}) throw new GradleException("Native world screenshot evidence incomplete: ${report}")
			logger.lifecycle("Native world validation passed: {} required observations, {} signed turns: {}", required.size(), axes.size(), report)
		}
	}
}

[
		"runServerSelfTest"                 : ["simulation", "angle"],
		"runPlayableServerSelfTest"         : ["playable", "angle"],
		"runPlayableHorizonServerSelfTest"  : ["playable", "horizon"],
		"runPlayableAcroServerSelfTest"     : ["playable", "acro"]
].each { taskName, expected ->
	tasks.named(taskName) { task ->
		group = "verification"
		description = "Runs and validates the ${expected[0]} ${expected[1]} FPV Dronecraft dedicated-server self-test."
		fpvDroneConfigureSelfTestTask(task, expected[0], expected[1], Math.multiplyExact(fpvDroneSelfTestSeconds, 20))
	}
}

tasks.register("validateExternalServerSelfTest") {
	group = "verification"
	description = "Validates a server self-test report produced by an isolated production NeoForge instance."

	doLast {
		def reportPath = providers.gradleProperty("fpvdroneExternalSelfTestReport").orNull
		def flightModel = providers.gradleProperty("fpvdroneExternalSelfTestFlightModel").orNull
		def controlMode = providers.gradleProperty("fpvdroneExternalSelfTestControlMode").orNull
		def durationText = providers.gradleProperty("fpvdroneExternalSelfTestDurationTicks").orNull
		if ([reportPath, flightModel, controlMode, durationText].any { it == null || it.trim().isEmpty() }) {
			throw new GradleException("External self-test validation requires report, flight model, control mode, and duration tick properties.")
		}

		int durationTicks
		try {
			durationTicks = Integer.parseInt(durationText.trim())
		} catch (NumberFormatException ignored) {
			throw new GradleException("fpvdroneExternalSelfTestDurationTicks must be a positive integer, but was '${durationText}'.")
		}
		if (durationTicks <= 0) {
			throw new GradleException("fpvdroneExternalSelfTestDurationTicks must be a positive integer, but was '${durationText}'.")
		}

		File reportFile = file(reportPath)
		if (!reportFile.isFile()) {
			throw new GradleException("External server self-test report does not exist: ${reportFile}")
		}
		fpvDroneValidateSelfTestReport(reportFile, flightModel, controlMode, durationTicks)
	}
}

tasks.named("runGameTestServer") {
	doFirst {
		File reportFile = gameTestReport.get().asFile
		delete(reportFile)
		reportFile.parentFile.mkdirs()
	}

	doLast {
		File reportFile = gameTestReport.get().asFile
		if (!reportFile.isFile()) {
			throw new GradleException("NeoForge GameTest report was not created: ${reportFile}")
		}

		def document = javax.xml.parsers.DocumentBuilderFactory.newInstance()
				.newDocumentBuilder()
				.parse(reportFile)
		def testCases = document.getElementsByTagName("testcase")
		def actualGameTests = (0..<testCases.length)
				.collect { index -> testCases.item(index).getAttribute("name") }
				.toSet()
		int tests = testCases.length
		int failures = document.getElementsByTagName("failure").length
		int errors = document.getElementsByTagName("error").length
		if (tests != requiredGameTests.size() || actualGameTests != requiredGameTests || failures != 0 || errors != 0) {
			throw new GradleException(
					"NeoForge GameTest gate mismatch: expected=${requiredGameTests.sort()}, actual=${actualGameTests.sort()}, failures=${failures}, errors=${errors}: ${reportFile}"
			)
		}
		logger.lifecycle("NeoForge GameTest gate passed: {} tests, {} failures, {} errors", tests, failures, errors)
	}
}

// Exercise the production SDL slot allocator without initializing SDL or Minecraft.
// Keep these standalone check classes out of all mod and source artifacts.
if (project.minecraft_version == "26.3") {
	def slotCheckClasses = layout.buildDirectory.dir("classes/sdlJoystickCheck")
	def compileSlotCheck = tasks.register("compileSdlJoystickCheck", JavaCompile) {
		source(files(
				"src/compat/mc263/java/com/tenicana/dronecraft/client/control/SdlJoystickSlots.java",
				"src/compat/mc263/test/java/com/tenicana/dronecraft/client/control/SdlJoystickSlotsCheck.java"))
		classpath = files()
		destinationDirectory = slotCheckClasses
		javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
		options.release = 25
	}
	def verifySlots = tasks.register("verifySdlJoystickSlots", JavaExec) {
		group = "verification"
		description = "Checks SDL hotplug capacity, active slot isolation and reconnect identity."
		dependsOn(compileSlotCheck)
		javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
		classpath = files(slotCheckClasses)
		mainClass = "com.tenicana.dronecraft.client.control.SdlJoystickSlotsCheck"
	}
	tasks.named("verifyNeoForgePackaging") { dependsOn(verifySlots) }
}
