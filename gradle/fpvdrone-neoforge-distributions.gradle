def fpvDronePresetDistributionDir = layout.buildDirectory.dir("fpvdrone-distributions")
def fpvDroneJar = tasks.named('jar', Jar)
def fpvDroneLegacyPresetText = "legacy_heavy_racing_quad\n"
def fpvDroneLegacyPresetFile = layout.buildDirectory.file("generated/fpvdrone/legacy-heavy-racing-quad/default_playable_preset.txt")

def generateLegacyHeavyPreset = tasks.register("generateLegacyHeavyPreset") {
	inputs.property("preset", fpvDroneLegacyPresetText)
	outputs.file(fpvDroneLegacyPresetFile)

	doLast {
		def presetFile = fpvDroneLegacyPresetFile.get().asFile
		presetFile.parentFile.mkdirs()
		presetFile.setText(fpvDroneLegacyPresetText, "UTF-8")
	}
}

tasks.register("legacyHeavyRacingQuadJar", Zip) {
	group = "build"
	description = "Builds the old heavy preset for comparison with the agile production default."
	dependsOn(fpvDroneJar, generateLegacyHeavyPreset)

	archiveFileName = "legacy-heavy-racing-quad.jar"
	destinationDirectory = fpvDronePresetDistributionDir
	preserveFileTimestamps = false
	reproducibleFileOrder = true
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from({ zipTree(fpvDroneJar.get().archiveFile.get().asFile) }) {
		exclude "assets/fpvdrone/default_playable_preset.txt"
	}
	from(fpvDroneLegacyPresetFile) {
		into "assets/fpvdrone"
	}
}

tasks.register("fiveInchAgileCandidateJar", Copy) {
	group = "build"
	description = "Copies the production jar, whose default preset is 5inch_agile_candidate."
	dependsOn(fpvDroneJar)
	from(fpvDroneJar.flatMap { it.archiveFile })
	into(fpvDronePresetDistributionDir)
	rename { "5inch-agile-candidate.jar" }
}

tasks.register("playablePresetJars") {
	group = "build"
	description = "Builds both legacy-heavy-racing-quad.jar and 5inch-agile-candidate.jar NeoForge test artifacts."
	dependsOn("legacyHeavyRacingQuadJar", "fiveInchAgileCandidateJar")
}
