		"build/research/dda-production-fixture-v1.expected-v1.bin"
	)
}

tasks.register("verifyDdaProductionBundleFile", JavaExec) {
	group = "verification"
	description = "Verifies a production DDA bundle with the Java reader."
	classpath = sourceSets.main.runtimeClasspath
	mainClass.set(
		"com.tenicana.dronecraft.acoustics.tools.DdaProductionSnapshotBundleVerifyCli"
	)
	doFirst {
		if (!project.hasProperty("bundle")) {
			throw new GradleException(
				"Pass -Pbundle=<production-dda-bundle>"
			)
		}
		args(
			"--require-complete",
			rootProject.file(project.property("bundle")).absolutePath
		)
	}
}

tasks.register("generateDdaProductionExpectedResults", JavaExec) {
	group = "verification"
	description = "Generates Java CPU expected results for a complete DDA bundle."
	classpath = sourceSets.main.runtimeClasspath
	mainClass.set(
		"com.tenicana.dronecraft.acoustics.tools.DdaProductionExpectedResultsCli"
	)
	doFirst {
		if (!project.hasProperty("bundle")) {
			throw new GradleException(
				"Pass -Pbundle=<production-dda-bundle>"
			)
		}
		def bundle = rootProject.file(project.property("bundle"))
		def expected = project.hasProperty("expectedResults")
			? rootProject.file(project.property("expectedResults"))
			: new File(bundle.parentFile, bundle.name + ".expected-v1.bin")
		args("generate", bundle.absolutePath, expected.absolutePath)
	}
}

tasks.register("verifyDdaProductionExpectedResults", JavaExec) {
	group = "verification"
	description = "Recomputes and verifies Java CPU DDA expected results."
	classpath = sourceSets.main.runtimeClasspath
	mainClass.set(
		"com.tenicana.dronecraft.acoustics.tools.DdaProductionExpectedResultsCli"
	)
	doFirst {
		if (!project.hasProperty("bundle")
				|| !project.hasProperty("expectedResults")) {
			throw new GradleException(
				"Pass -Pbundle=<bundle> -PexpectedResults=<sidecar>"
			)
		}
		args(
			"verify",
			rootProject.file(project.property("bundle")).absolutePath,
			rootProject.file(project.property("expectedResults")).absolutePath
		)
	}
}

